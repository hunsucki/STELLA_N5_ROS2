scan_to_scan_filter_chain:
  ros__parameters:
    # Legacy bounds from the former lower mount. robot.launch.py keeps this
    # filter disabled until the rear-upper mounting blind sectors are measured.
    filter1:
      name: angle
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        lower_angle: 0.087
        upper_angle: 3.054
