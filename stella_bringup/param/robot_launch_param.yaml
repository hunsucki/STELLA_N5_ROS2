launch_lidar2: true
# Disabled until the angular filter is recalibrated for the rear upper mount.
launch_lidar2_filter: false
launch_usb_cam: false
launch_realsense: true
launch_pointcloud: false
launch_pointcloud_laserscan_filter: false
launch_hailo: false
launch_linear_motor: true
launch_battery: true

# Odometry sensor rates. The motor driver's paired encoder query saturates near
# 31 Hz on this robot, so 30 Hz is the practical high-rate setting.
encoder_poll_rate_hz: 30
imu_sync_period_ms: 5
imu_publish_rate_hz: 100
imu_read_rate_hz: 0
# Hardware-tested reader pacing; 1250 us produced a stable 100 Hz /imu/data.
imu_read_success_sleep_us: 1250

# Raspberry Pi 5 has cores 0-3. Keep the two serial drivers on separate cores.
motor_cpu_affinity: 2
imu_cpu_affinity: 3

# Exactly one odometry implementation should publish /odom and odom TF.
launch_wheel_odometry: true
enable_legacy_odom: false
