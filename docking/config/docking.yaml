docking_server:
  ros__parameters:
    controller_frequency: 10.0
    # One automatic retreat/re-approach handles a transient lost tag without
    # requiring the operator to restart the whole sequence.
    max_retries: 1
    base_frame: base_link
    fixed_frame: odom

    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_approach_timeout: 45.0

    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock

      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      staging_x_offset: -0.80
      staging_yaw_offset: 0.0

      external_detection_translation_x: -0.95
      external_detection_translation_y: 0.0
      external_detection_rotation_yaw: 0.0
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: -1.57
      external_detection_timeout: 1.0
      filter_coef: 0.1

      # Hand over while enough forward distance remains for lateral correction.
      docking_threshold: 0.45

    controller:
      transform_tolerance: 0.3
      v_linear_max: 0.10
      v_linear_min: 0.05
      v_angular_max: 0.15
      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_max_angular_accel: 0.4
      use_collision_detection: false

      k_phi: 1.0
      k_delta: 1.0
      slowdown_radius: 0.50

    docks: ['home_dock']
    home_dock:
      type: simple_charging_dock
      frame: odom
      pose: [0.0, 0.0, 0.0]
      id: tag36h11:0

# Parameters for `ros2 run docking dock_turn_backup`.  The executable loads
# this file automatically; command-line `-p` overrides still take precedence.
dock_turn_backup:
  ros__parameters:
    # Geometry-only testing: stop after LiDAR docking, without starting charge.
    development_test_mode: true
    # New bounded precision stage after Nav2 DockRobot.  Set false to restore
    # the previous successful sequence without any precision motion.
    use_tag_pose_refinement: true
    tag_refinement_target_pose_topic: /dock_pose
    tag_refinement_target_wait_timeout_sec: 1.0
    tag_refinement_target_max_age_sec: 1.5
    # Position correction and final yaw settling need separate time budgets.
    # The September 9 run exhausted 18s while still recovering its heading.
    tag_refinement_timeout_sec: 45.0
    # Allow small front residuals; rear LiDAR checks actual guide clearance.
    tag_refinement_longitudinal_tolerance: 0.02
    tag_refinement_lateral_tolerance: 0.025
    # AprilTag supplies both the center and face-normal heading. Front LiDAR
    # only checks distance/clearance; rear guide control remains independent.
    use_apriltag_front_centering: true
    use_lidar_tag_centering: false
    # Match simple_charging_dock.external_detection_translation_x above.
    apriltag_front_standoff: 0.95
    # Local steering pivot estimate from stationary tag/IMU rotation in trial 41.
    # Confirm against the driven-axle position; final success still checks base.
    apriltag_front_axle_x: 0.10
    tag_front_body_reference_x: 0.2295
    tag_front_min_lidar_clearance: 0.05
    # Include deceleration/settling after the Nav2 action before gathering
    # three distinct stationary observations; finish early as soon as ready.
    tag_centering_wait_sec: 2.5
    tag_centering_stable_pairs: 3
    # Estimated-target change, not permitted guide error.
    tag_centering_max_shift: 0.15
    tag_refinement_yaw_tolerance: 0.034906585  # 2 deg
    tag_refinement_stable_cycles: 5
    tag_refinement_stationary_linear_speed: 0.005
    tag_refinement_linear_kp: 0.50
    tag_refinement_angular_k_alpha: 1.00
    tag_refinement_angular_k_beta: -0.30
    tag_refinement_final_yaw_kp: 1.00
    tag_refinement_max_linear_speed: 0.04
    tag_refinement_max_angular_speed: 0.08
    # Rotate toward the target point first. Translation fades to zero at 8 deg,
    # preventing a wide arc from consuming the yaw/travel safety envelope.
    tag_refinement_translation_heading_limit: 0.139626340  # 8 deg
    # Only after stationary yaw stall; capped at the existing 180-degree spin speed.
    tag_refinement_recovery_max_angular_speed: 0.15
    # Start local centering earlier to keep the tag in view while correcting
    # a ~12 cm lateral error. Preserve the 30-degree rotation budget.
    tag_refinement_max_initial_distance: 0.50
    # Deprecated axis/yaw gates retained for compatible parameter files.
    # Runtime feasibility uses radial distance and the planned yaw excursion.
    tag_refinement_max_initial_longitudinal: 0.18
    tag_refinement_max_initial_lateral: 0.10
    tag_refinement_max_initial_yaw: 0.436332313  # 25 deg
    tag_refinement_max_travel: 0.50
    tag_refinement_max_yaw_excursion: 0.523598776  # 30 deg
    tag_refinement_control_rate_hz: 20.0
    tag_refinement_abort_on_failure: true

    # Covers one Nav2 retry plus bounded refinement, spin, alignment and backup.
    total_timeout_sec: 180.0

    # Rear-plane alignment first acquires a stable surface while stopped.
    # Ignore one soft RANSAC jump; reacquire only when it repeats.
    lidar_align_timeout_sec: 18.0
    # Separate the panel from adjacent bent frame points (stationary scan replay).
    lidar_align_ransac_threshold: 0.010
    lidar_align_max_rotation: 0.314159265  # 18 deg
    # If a soft plane inconsistency forces reacquisition, preserve the spent
    # rotation and add the new measured error plus margin, capped at 30 deg.
    lidar_align_rotation_margin: 0.052359878  # 3 deg
    lidar_align_hard_max_rotation: 0.523598776  # 30 deg
    lidar_align_acquisition_stable_cycles: 3
    lidar_align_acquisition_max_residual: 0.052359878  # 3 deg
    lidar_align_max_tracking_residual: 0.087266463  # 5 deg
    lidar_align_tracking_outlier_cycles: 2
    lidar_align_hard_tracking_residual: 0.209439510  # 12 deg

    # The former blind one-second forward motion is disabled independently.
    # Re-enable this flag to reproduce that step without enabling refinement.
    use_pre_spin_forward: false
    pre_spin_forward_duration_sec: 1.0
    pre_spin_forward_speed: 0.03
    pre_spin_forward_max_distance: 0.05

    # The successful dock measured 0.078 m from the rear LiDAR origin to the
    # wall.  The LiDAR is 0.0635 m ahead of the rear body reference, so this
    # is a 0.0145 m body clearance.  A +/-0.010 m tolerance corresponds to a
    # directly measurable LiDAR-to-wall range of 0.068..0.088 m.
    backup_target_rear_clearance: 0.0145
    backup_clearance_tolerance: 0.010
    # Back up slowly enough to stop before a guide rail after a rejected scan.
    backup_speed: 0.035
    # Include the optional forward reposition in the bounded return distance.
    backup_max_travel: 0.75
    backup_min_speed: 0.012
    backup_slowdown_clearance: 0.18

    # Keep a fixed wall/robot-yaw invariant during reverse.  This catches the
    # September 15 failure where RANSAC stayed near 0 deg while the chassis
    # rotated more than 5 deg, then permits the real -5.5 deg plane to be
    # reacquired and corrected while translation is stopped.
    # Follow/unwind the continuous guide path without raising angular limits.
    backup_heading_kp: 0.8
    backup_heading_max_angular_speed: 0.015
    backup_heading_max_angular_accel: 0.030
    # In-place correction uses the proven LiDAR alignment speed, with bounded
    # progress/gyro checks. Reverse steering retains its separate 0.015 limit.
    backup_stationary_heading_max_angular_speed: 0.06
    backup_stationary_heading_min_angular_speed: 0.025
    backup_heading_pause_error: 0.052359878  # 3 deg
    backup_max_yaw_drift: 0.139626340  # 8 deg
    backup_lidar_heading_max_error: 0.139626340  # 8 deg
    backup_lidar_motion_residual: 0.034906585  # 2 deg
    # Stable disagreement up to 4 deg may use encoder-only straight heading;
    # the suspect LiDAR plane is never used to steer in this guarded mode.
    backup_lidar_wheel_guard_residual: 0.069813170  # 4 deg
    backup_plane_reacquire_timeout_sec: 3.0

    # Live replay and physical inspection both confirmed a right-side intrusion.
    # Keep the entry guard; improve centering BEFORE the 180-degree turn.
    use_lidar_guide_centering: true
    # Commit to straight entry while five near-dock rail/panel observations
    # still verify the whole remaining corridor, BEFORE near-field fits drift.
    # Measured width, center and body rotation set the IMU heading budget.
    backup_guide_visibility_handoff_clearance: 0.32
    # User measured THIS fixed station: 54 cm inside, 44 cm robot body.
    # Reserve 1 cm of width uncertainty. Set known width to 0 at other docks.
    # LiDAR still supplies center/heading; no missing rail creates a center.
    backup_guide_known_width: 0.54
    backup_guide_known_width_uncertainty: 0.01
    # Keep side returns as the guide tips pass beside the rear LiDAR.
    # This changes guide fitting only, not the rear panel or collision sectors.
    lidar_guide_sector_width: 3.839724354  # 220 deg, rear +/-110 deg
    # One forward reposition is allowed only when fresh front/rear scans
    # establish its swept footprint is clear. Never lower the entry margin.
    use_dock_entry_recovery: true
    # Measured 2026-10-02: 0.54 m inside guide width, 0.44 m body width.
    # Require two stable rails before entry; allow 4 cm measurement variation.
    lidar_guide_min_separation: 0.50
    lidar_guide_max_separation: 0.58
    backup_guide_center_kp: 1.0
    backup_guide_center_tolerance: 0.015
    backup_guide_center_max_heading: 0.069813170  # 4 deg

# ManagedStack passes this same file to the bridge.
apriltag_to_pose_bridge:
  ros__parameters:
    transform_max_age_sec: 0.50
    transform_future_tolerance_sec: 0.05
