/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.154
    max_hamming: 1
    # Fresh mono frames use best effort to avoid stale-frame retransmissions.
    # This subscriber also accepts reliable CameraInfo and legacy image output.
    qos_profile: sensor_data

    detector:
      threads: 1
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    pose_estimation_method: pnp
